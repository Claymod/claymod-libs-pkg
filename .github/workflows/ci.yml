name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (pkl + hermetic tests)
    runs-on: ubuntu-latest
    # The control-server image ships the full claymod CLI, the pkl CLI and
    # git — everything this job used to install and build. It tracks the
    # default branch of Claymod/Claymod, so CI breaks early if claymod
    # changes something the library depends on; pin a sha-<sha> tag here
    # if reproducibility ever matters more than early signal.
    container:
      image: ghcr.io/claymod/claymod:latest
    steps:
      - uses: actions/checkout@v4

      # The test tooling (extract.py, check_ops.py) needs python3; the
      # image is bookworm-slim and does not carry it.
      - name: Install python3
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3

      # The library imports modulepath:/claymod/base.pkl. Testing against
      # the source schema (not the image's embedded copy) validates the
      # fixture against claymod's current schema as it evolves. A public
      # checkout needs no secret: actions/checkout uses the default
      # workflow token.
      - name: Check out the claymod schema
        uses: actions/checkout@v4
        with:
          repository: Claymod/Claymod
          path: claymod

      - name: Tests
        env:
          CLAYMOD_SCHEMA: ${{ github.workspace }}/claymod/pkl
        run: sh tests/run.sh

      - name: Evaluate the simulation fixture
        env:
          CLAYMOD_SCHEMA: ${{ github.workspace }}/claymod/pkl
        run: |
          pkl eval --format json --color never \
            --module-path "$PWD/pkl:$CLAYMOD_SCHEMA" \
            tests/playbook.ci.pkl >tests/.build/playbook-ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: playbook-ci
          path: tests/.build/playbook-ci.json
          retention-days: 1

  simulate:
    name: Simulate (${{ matrix.image }})
    needs: validate
    # Real package managers, real repositories: worth the minutes on main
    # and on tags, not on every pull request. workflow_dispatch runs it too.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - fedora:latest
          - alpine:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: playbook-ci
          path: tests/.build

      - name: Run the pkg recipes in ${{ matrix.image }}
        run: sh tests/docker_simulate.sh "${{ matrix.image }}" tests/.build/playbook-ci.json
